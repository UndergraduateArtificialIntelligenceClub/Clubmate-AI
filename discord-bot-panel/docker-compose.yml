services:
  postgres:
    image: postgres:15-alpine
    container_name: CMAI_db
    environment:
      POSTGRES_USER: soy
      POSTGRES_PASSWORD: groovy
      POSTGRES_DB: CMAI
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U soy -d CMAI" ]
      interval: 5s
      timeout: 5s
      retries: 5
