# Alembic Configuration
# See https://alembic.sqlalchemy.org/en/latest/ for documentation

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend timestamp to migration file names (UTC)
prepend_date = True

# Path separator for Windows/Linux compatibility
path_separator = /

# Timezone for timestamps
timezone = UTC

# DSN for the database (overridden by env.py for async)
# sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/clubmate

[post_write_hooks]
# Hooks to run after generating migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
